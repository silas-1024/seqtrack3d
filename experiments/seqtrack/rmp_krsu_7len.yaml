# E6a-KRSU-lite: E2 residual RMP + inference-only Kalman-style residual state update
DATA:
  MAX_SAMPLE_INTERVAL: 400
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3.5
    FACTOR: 4.0
    SCALE_JITTER: 0.5
    SIZE: 256
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 4.0
    SCALE_JITTER: 0
    SIZE: 256
    NUMBER: 2
  TRAIN:
    DATASETS_NAME:
    - SV248S_TRAIN
    - VISO_TRAIN
    DATASETS_RATIO:
    - 1
    - 1
    SAMPLE_PER_EPOCH: 60000
MODEL:
  ENCODER:
    TYPE: vit_base_patch16
    PRETRAIN_TYPE: mae
  DECODER:
    DEC_LAYERS: 2
  HIDDEN_DIM: 256
  BINS: 4000
  FEATURE_TYPE: x
  MOTION:
    ENABLE: True
    HISTORY_LENGTH: 7
    HIDDEN_DIM: 256
    NUM_LAYERS: 2
    NUM_HEADS: 8
    MOTION_LOSS_WEIGHT: 0.0
    ENABLE_RELIABILITY: True
    ENABLE_MOTION_ENCODER: True
    ENABLE_MOTION_GUIDED_ATTN: True
    MOTION_DELTA_TYPE: residual
    AFFINE_CACHE_ENABLE: true
    AFFINE_CACHE_ROOT: ./residual_data/affine_cache
    AFFINE_CACHE_FALLBACK: identity
TRAIN:
  ENCODER_MULTIPLIER: 0.1
  BATCH_SIZE: 16
  EPOCH: 60
  GRAD_CLIP_NORM: 0.1
  CE_WEIGHT: 1.0
  LR: 0.0001
  LR_DROP_EPOCH: 48
  NUM_WORKER: 8
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  WEIGHT_DECAY: 0.0001
TEST:
  EPOCH: 60
  CHECKPOINT_YAML_NAME: seqtrack_b256_rmp_residual
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 4.0
  TEMPLATE_SIZE: 256
  WINDOW: true
  NUM_TEMPLATES: 2
  USE_KRSU: true
  KRSU_MODE: kalman_lite
  KRSU_CENTER_ONLY: true
  KRSU_USE_LOGIT_CONF: true
  KRSU_USE_AFFINE_VALID: true
  KRSU_Q_SCALE: 1.0
  KRSU_R_SCALE: 400.0
  KRSU_BOOTSTRAP_Q: 400.0
  KRSU_TARGET_Q_FLOOR_SCALE: 0.5
  KRSU_MIN_HISTORY_FOR_PRIOR: 2
  KRSU_AFFINE_INVALID_Q_PENALTY: 4.0
  KRSU_MAX_UPDATE_PIXELS: 20
  KRSU_DYNAMIC_CLIP: true
  KRSU_MIN_R: 1.0e-4
  KRSU_MIN_Q: 1.0e-4
  KRSU_MIN_P: 1.0e-4
  UPDATE_INTERVALS:
    SV248S_TEST: 20
    SATSOT: 20
    VISO: 20
  UPDATE_THRESHOLD:
    SV248S_TEST: 0.45
    SATSOT: 0.45
    VISO: 0.45
